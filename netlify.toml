[build]
  publish = "public"

# Proxy API + logo route to the Render backend, so the frontend's relative /api calls keep working.
# >>> Replace YOUR-RENDER-APP with your real Render service name <<<
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-APP.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/img/college-logo"
  to = "https://YOUR-RENDER-APP.onrender.com/img/college-logo"
  status = 200
  force = true
